[tools]
terraform = "1.9"
jq = "latest"
kubectl = "latest"
talosctl = "latest"
helm = "latest"
pre-commit = "latest"
tflint = "latest"
terraform-docs = "latest"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/secrets/talosconfig"
CILIUM_VERSION = "1.20.0"

[tasks.preflight]
description = "Check API token, privileges, node, datastores, VM IDs, IPs, SSH, capacity"
run = "scripts/preflight.sh"

[tasks.tfdocs]
description = "regenerate the README of every terraform root (CI checks these are current)"
shell = "bash -c"
run = """
set -euo pipefail
for d in $(scripts/tf-roots.sh); do
  terraform-docs -c .pre-commit-config.tfdocs.yml "$d"
done
"""

[tasks.tflint]
description = "tflint every terraform root (same set as .github/workflows/terraform_checks.yml)"
shell = "bash -c"
env = { TFLINT_CONFIG_FILE = "{{config_root}}/.tflint.hcl" }
run = """
set -euo pipefail
tflint --init
rc=0
for d in $(scripts/tf-roots.sh); do
  echo "== $d"
  tflint --chdir="$d" --format=compact || rc=$?
done
exit $rc
"""

# ------------------------------------------------------------ terraform ----

[tasks."tf:init"]
description = "terraform init, re-resolving providers (state lives in R2)"
run = "scripts/tf-init.sh --force terraform/proxmox"

[tasks."tf:plan"]
description = "terraform plan"
dir = "terraform/proxmox"
shell = "bash -c"
run = """
set -euo pipefail
../../scripts/tf-init.sh terraform/proxmox
terraform plan
"""

[tasks."tf:apply"]
description = "Create the VMs, apply machine configs, bootstrap the cluster"
dir = "terraform/proxmox"
shell = "bash -c"
run = """
set -euo pipefail
../../scripts/tf-init.sh terraform/proxmox
terraform apply
"""

[tasks."tf:destroy"]
description = "DESTRUCTIVE: destroy the cluster VMs only — this root also owns the PVE host"
dir = "terraform/proxmox"
shell = "bash -c"
run = """
set -euo pipefail
terraform destroy \
  -target='proxmox_virtual_environment_vm.node' \
  -target='talos_machine_configuration_apply.node' \
  -target='talos_machine_bootstrap.this' \
  -target='talos_cluster_kubeconfig.this'
"""

# ------------------------------------------------------------ cloudflare ----
#
# terraform/cloudflare/ — the tunnel, its ingress rules and the DNS records.

[tasks."cf:init"]
description = "terraform init for the Cloudflare root"
run = "scripts/tf-init.sh --force terraform/cloudflare cloudflare-api-token"

[tasks."cf:plan"]
description = "Plan the tunnel, ingress rules and DNS records"
dir = "terraform/cloudflare"
shell = "bash -c"
run = """
set -euo pipefail
../../scripts/tf-init.sh terraform/cloudflare cloudflare-api-token
export CLOUDFLARE_API_TOKEN=$(cat ../../secrets/cloudflare-api-token)
source ../../scripts/r2-env.sh
terraform plan
"""

[tasks."cf:apply"]
description = "Apply the tunnel, ingress rules and DNS records"
dir = "terraform/cloudflare"
shell = "bash -c"
run = """
set -euo pipefail
../../scripts/tf-init.sh terraform/cloudflare cloudflare-api-token
export CLOUDFLARE_API_TOKEN=$(cat ../../secrets/cloudflare-api-token)
source ../../scripts/r2-env.sh
terraform apply
"""

# ---------------------------------------------------------------- oracle ----
#
# terraform/oracle/ — the Object Storage bucket CloudNativePG backs up into

[tasks."oci:init"]
description = "terraform init for the Oracle backups root"
run = "scripts/tf-init.sh --force terraform/oracle oci.env oci_api_key.pem"

[tasks."oci:plan"]
description = "Plan the CNPG backup bucket and its IAM user"
dir = "terraform/oracle"
shell = "bash -c"
run = """
set -euo pipefail
../../scripts/tf-init.sh terraform/oracle oci.env oci_api_key.pem
source ../../scripts/oci-env.sh
terraform plan
"""

[tasks."oci:apply"]
description = "Create the CNPG backup bucket and its IAM user"
dir = "terraform/oracle"
shell = "bash -c"
run = """
set -euo pipefail
../../scripts/tf-init.sh terraform/oracle oci.env oci_api_key.pem
source ../../scripts/oci-env.sh
terraform apply
"""

[tasks."oci:creds"]
description = "Print the values for apps/base/cnpg/cluster/backup-oci.sops.yaml"
dir = "terraform/oracle"
shell = "bash -c"
run = """
set -euo pipefail
echo "cluster.yaml   endpointURL:     $(terraform output -raw endpoint_url)"
echo "cluster.yaml   destinationPath: $(terraform output -raw destination_path)"
echo
echo "backup-oci.sops.yaml stringData:"
echo "  access-key-id:     $(terraform output -raw access_key_id)"
echo "  secret-access-key: $(terraform output -raw secret_access_key)"
echo "  region:            $(terraform output -raw region)"
"""

# ----------------------------------------------------------------- talos ----

[tasks.talosconfig]
description = "Write secrets/talosconfig from Terraform state"
dir = "terraform/proxmox"
shell = "bash -c"
run = """
set -euo pipefail
mkdir -p ../../secrets
umask 077
terraform output -raw talosconfig > ../../secrets/talosconfig
echo "wrote secrets/talosconfig (TALOSCONFIG is already set by mise in this repo)"
"""

[tasks.kubeconfig]
description = "Write ./kubeconfig from Terraform state, pointed at the VIP"
dir = "terraform/proxmox"
shell = "bash -c"
run = """
set -euo pipefail
umask 077
terraform output -raw kubeconfig > ../../kubeconfig
echo "wrote kubeconfig (KUBECONFIG is already set by mise in this repo)"
"""

[tasks.cilium]
description = "Install/upgrade Cilium — required within ~10min of bootstrap or nodes reboot"
shell = "bash -c"
run = """
set -euo pipefail
helm repo add cilium https://helm.cilium.io/ >/dev/null
helm repo update cilium >/dev/null
# Hubble's ServiceMonitor is a hard apply failure until kube-prometheus-stack
# has created the CRD, which Flux only does after the CNI is up.
if kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; then
  servicemonitor=true
else
  servicemonitor=false
  echo "no ServiceMonitor CRD yet — rendering Hubble without it"
fi
helm template cilium cilium/cilium \
  --version "$CILIUM_VERSION" \
  --namespace kube-system \
  --values talos/cilium-values.yaml \
  --set hubble.metrics.serviceMonitor.enabled="$servicemonitor" \
  | kubectl apply -f -
kubectl apply -f talos/hubble-ui-ingress.yaml
echo
echo "waiting for nodes to go Ready ..."
kubectl wait --for=condition=Ready nodes --all --timeout=300s
"""

[tasks.health]
description = "talosctl health against the cluster"
shell = "bash -c"
run = """
set -euo pipefail
node=$(jq -r '.nodes[] | select(.role=="controlplane") | .ip' terraform/proxmox/cluster.auto.tfvars.json | head -1)
talosctl -n "$node" health
"""

[tasks.upgrade]
description = "Upgrade Talos on every node to the version in terraform/proxmox/cluster.auto.tfvars.json, one at a time"
shell = "bash -c"
run = """
set -euo pipefail
schematic=$(terraform -chdir=terraform/proxmox output -json talos_image | jq -r .schematic_id)
version=$(jq -r '.cluster.talos_version' terraform/proxmox/cluster.auto.tfvars.json)
for ip in $(jq -r '.nodes[].ip' terraform/proxmox/cluster.auto.tfvars.json); do
  echo "==> $ip"
  talosctl -n "$ip" upgrade --image "factory.talos.dev/installer/$schematic:$version" --wait
done
"""

[tasks."upgrade-k8s"]
description = "Upgrade Kubernetes to the version in terraform/proxmox/cluster.auto.tfvars.json"
shell = "bash -c"
run = """
set -euo pipefail
node=$(jq -r '.nodes[] | select(.role=="controlplane") | .ip' terraform/proxmox/cluster.auto.tfvars.json | head -1)
version=$(jq -r '.cluster.kubernetes_version' terraform/proxmox/cluster.auto.tfvars.json | sed 's/^v//')
talosctl -n "$node" upgrade-k8s --to "$version"
"""

[tasks.reset]
description = "DESTRUCTIVE: wipe every node back to maintenance mode"
shell = "bash -c"
run = """
set -euo pipefail
echo "This wipes all state on every node: etcd, certificates, workloads, /var."
read -r -p "type the cluster name to confirm: " answer
[ "$answer" = "$(jq -r '.cluster.name' terraform/proxmox/cluster.auto.tfvars.json)" ] || { echo "aborted"; exit 1; }

for ip in $(jq -r '.nodes[].ip' terraform/proxmox/cluster.auto.tfvars.json); do
  echo "==> $ip"
  talosctl -n "$ip" reset --graceful=false --reboot --wait=false || true
done
echo "nodes rebooting into maintenance mode — re-run 'mise run tf:apply' to rebuild"
"""

[tasks."nfs:status"]
description = "NFS server: export list, free space, and whether the StorageClass agrees"
run = "scripts/nfs-status.sh"

# --------------------------------------------------------------- tailnet ----

[tasks."ts:init"]
description = "terraform init for the tailnet policy root (state lives in R2)"
run = "scripts/tf-init.sh --force tailscale tailscale-oauth.env"

[tasks."ts:plan"]
description = "Plan the tailnet policy file"
dir = "tailscale"
shell = "bash -c"
run = """
set -euo pipefail
../scripts/tf-init.sh tailscale tailscale-oauth.env
set -a; . ../secrets/tailscale-oauth.env; set +a
source ../scripts/r2-env.sh
terraform plan
"""

[tasks."ts:apply"]
description = "Apply the tailnet policy file (CI does this on push to main)"
dir = "tailscale"
shell = "bash -c"
run = """
set -euo pipefail
../scripts/tf-init.sh tailscale tailscale-oauth.env
set -a; . ../secrets/tailscale-oauth.env; set +a
source ../scripts/r2-env.sh
terraform apply
"""

[tasks."ts:status"]
description = "The in-cluster subnet router and the operator's proxies"
shell = "bash -c"
run = """
set -euo pipefail
kubectl -n tailscale get connector,pods -o wide
"""

# ----------------------------------------------------------------- kube ----

[tasks.status]
description = "Show nodes and control-plane pods"
shell = "bash -c"
run = """
kubectl get nodes -o wide
echo
kubectl -n kube-system get pods
"""

# ------------------------------------------------------------- one-shot ----

[tasks.bootstrap]
description = "Full path: VMs -> machine configs -> bootstrap -> Cilium -> status"
shell = "bash -c"
run = """
set -euo pipefail
mise run tf:apply
mise run talosconfig
mise run kubeconfig
mise run cilium
mise run status
"""
