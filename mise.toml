[tools]
terraform = "1.15"
sops = "3.13.3"
age = "latest"
jq = "latest"
kubectl = "latest"
talosctl = "latest"
helm = "latest"
pre-commit = "latest"
tflint = "latest"
terraform-docs = "0.20.0"  # matches terraform-docs/gh-actions, so CI and local agree
k9s = "latest"

[env]
# Both age identities: the one apps/ uses, and the terraform-only one.
SOPS_AGE_KEY_FILE = "{{config_root}}/secrets/age.key"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/secrets/talosconfig"
CILIUM_VERSION = "1.20.0"

OCI_SDK_DEFAULT_RETRY_ENABLED = "true"

[tasks.preflight]
description = "Check API token, privileges, node, datastores, VM IDs, IPs, SSH, capacity"
run = "scripts/preflight.sh"

[tasks.tfdocs]
description = "regenerate the README of every terraform root (CI checks these are current)"
shell = "bash -c"
run = """
set -euo pipefail
for d in $(scripts/tf.sh roots); do
  terraform-docs -c .pre-commit-config.tfdocs.yml "$d"
done
"""

[tasks.tflint]
description = "tflint every terraform root"
shell = "bash -c"
env = { TFLINT_CONFIG_FILE = "{{config_root}}/.tflint.hcl" }
run = """
set -euo pipefail
tflint --init
rc=0
for d in $(scripts/tf.sh roots); do
  echo "== $d"
  tflint --chdir="$d" --format=compact || rc=$?
done
exit $rc
"""

# Every root goes through scripts/tf.sh: secrets, backend configuration and the
# retries for Object Storage's spurious errors live there, not here.

[tasks."global:init"]
description = "terraform init for the state-bucket root"
run = "scripts/tf.sh global init"

[tasks."global:plan"]
description = "Plan the state bucket and the terraform-ci user"
run = "scripts/tf.sh global plan"

[tasks."global:apply"]
description = "Apply the state bucket and the terraform-ci user"
run = "scripts/tf.sh global apply"

[tasks."global:backend"]
description = "Print the bucket, namespace and region every backend block resolves against"
shell = "bash -c"
run = """
set -euo pipefail
echo "bucket:    $(scripts/tf.sh global output -raw bucket)"
echo "namespace: $(scripts/tf.sh global output -raw namespace)"
echo "region:    $(scripts/tf.sh global output -raw region)"
"""

[tasks."global:ci-creds"]
description = "Print the terraform-ci credentials, in the shape secrets.sops.yaml wants"
shell = "bash -c"
run = """
set -euo pipefail
echo "backend_tenancy_ocid: $(scripts/tf.sh global output -raw tenancy_ocid)"
echo "backend_user_ocid: $(scripts/tf.sh global output -raw ci_user_ocid)"
echo "backend_fingerprint: $(scripts/tf.sh global output -raw ci_fingerprint)"
echo "backend_namespace: $(scripts/tf.sh global output -raw namespace)"
echo "backend_region: $(scripts/tf.sh global output -raw region)"
echo "backend_private_key: |"
scripts/tf.sh global output -raw ci_private_key | sed 's/^/  /'
"""

[tasks."proxmox:init"]
description = "terraform init, re-resolving providers"
run = "scripts/tf.sh proxmox init"

[tasks."proxmox:plan"]
description = "Plan the VMs, machine configs and bootstrap"
run = "scripts/tf.sh proxmox plan"

[tasks."proxmox:apply"]
description = "Create the VMs, apply machine configs, bootstrap the cluster"
run = "scripts/tf.sh proxmox apply"

[tasks."proxmox:destroy"]
description = "DESTRUCTIVE: destroy the cluster VMs only — this root also owns the PVE host"
run = "scripts/tf.sh proxmox destroy -target='proxmox_virtual_environment_vm.node' -target='talos_machine_configuration_apply.node' -target='talos_machine_bootstrap.this' -target='talos_cluster_kubeconfig.this'"

[tasks."cloudflare:init"]
description = "terraform init for the Cloudflare root"
run = "scripts/tf.sh cloudflare init"

[tasks."cloudflare:plan"]
description = "Plan the tunnel, ingress rules and DNS records"
run = "scripts/tf.sh cloudflare plan"

[tasks."cloudflare:apply"]
description = "Apply the tunnel, ingress rules and DNS records"
run = "scripts/tf.sh cloudflare apply"

[tasks."oracle:init"]
description = "terraform init for the CNPG backup root"
run = "scripts/tf.sh oracle init"

[tasks."oracle:plan"]
description = "Plan the CNPG backup bucket and its IAM user"
run = "scripts/tf.sh oracle plan"

[tasks."oracle:apply"]
description = "Create the CNPG backup bucket and its IAM user"
run = "scripts/tf.sh oracle apply"

[tasks."oracle:creds"]
description = "Print the values for apps/base/cnpg/cluster/backup-oci.sops.yaml"
shell = "bash -c"
run = """
set -euo pipefail
echo "cluster.yaml   endpointURL:     $(scripts/tf.sh oracle output -raw endpoint_url)"
echo "cluster.yaml   destinationPath: $(scripts/tf.sh oracle output -raw destination_path)"
echo
echo "backup-oci.sops.yaml stringData:"
echo "  access-key-id:     $(scripts/tf.sh oracle output -raw access_key_id)"
echo "  secret-access-key: $(scripts/tf.sh oracle output -raw secret_access_key)"
echo "  region:            $(scripts/tf.sh oracle output -raw region)"
"""

[tasks.talosconfig]
description = "Write secrets/talosconfig from Terraform state"
shell = "bash -c"
run = """
set -euo pipefail
mkdir -p secrets
umask 077
scripts/tf.sh proxmox output -raw talosconfig > secrets/talosconfig
echo "wrote secrets/talosconfig (TALOSCONFIG is already set by mise in this repo)"
"""

[tasks.kubeconfig]
description = "Write ./kubeconfig from Terraform state, pointed at the VIP"
shell = "bash -c"
run = """
set -euo pipefail
umask 077
scripts/tf.sh proxmox output -raw kubeconfig > kubeconfig
echo "wrote kubeconfig (KUBECONFIG is already set by mise in this repo)"
"""

[tasks.cilium]
description = "Install/upgrade Cilium — required within ~10min of bootstrap or nodes reboot"
shell = "bash -c"
run = """
set -euo pipefail
helm repo add cilium https://helm.cilium.io/ >/dev/null
helm repo update cilium >/dev/null
# Hubble's ServiceMonitor is a hard apply failure until kube-prometheus-stack
# has created the CRD, which Flux only does after the CNI is up.
if kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; then
  servicemonitor=true
else
  servicemonitor=false
  echo "no ServiceMonitor CRD yet — rendering Hubble without it"
fi
helm template cilium cilium/cilium \
  --version "$CILIUM_VERSION" \
  --namespace kube-system \
  --values talos/cilium-values.yaml \
  --set hubble.metrics.serviceMonitor.enabled="$servicemonitor" \
  | kubectl apply -f -
kubectl apply -f talos/hubble-ui-ingress.yaml
echo
echo "waiting for nodes to go Ready ..."
kubectl wait --for=condition=Ready nodes --all --timeout=300s
"""

[tasks.health]
description = "talosctl health against the cluster"
shell = "bash -c"
run = """
set -euo pipefail
node=$(jq -r '.nodes[] | select(.role=="controlplane") | .ip' terraform/proxmox/cluster.auto.tfvars.json | head -1)
talosctl -n "$node" health
"""

[tasks.upgrade]
description = "Upgrade Talos on every node to the version in terraform/proxmox/cluster.auto.tfvars.json, one at a time"
shell = "bash -c"
run = """
set -euo pipefail
schematic=$(scripts/tf.sh proxmox output -json talos_image | jq -r .schematic_id)
version=$(jq -r '.cluster.talos_version' terraform/proxmox/cluster.auto.tfvars.json)
for ip in $(jq -r '.nodes[].ip' terraform/proxmox/cluster.auto.tfvars.json); do
  echo "==> $ip"
  talosctl -n "$ip" upgrade --image "factory.talos.dev/installer/$schematic:$version" --wait
done
"""

[tasks."upgrade-k8s"]
description = "Upgrade Kubernetes to the version in terraform/proxmox/cluster.auto.tfvars.json"
shell = "bash -c"
run = """
set -euo pipefail
node=$(jq -r '.nodes[] | select(.role=="controlplane") | .ip' terraform/proxmox/cluster.auto.tfvars.json | head -1)
version=$(jq -r '.cluster.kubernetes_version' terraform/proxmox/cluster.auto.tfvars.json | sed 's/^v//')
talosctl -n "$node" upgrade-k8s --to "$version"
"""

[tasks.reset]
description = "DESTRUCTIVE: wipe every node back to maintenance mode"
shell = "bash -c"
run = """
set -euo pipefail
echo "This wipes all state on every node: etcd, certificates, workloads, /var."
read -r -p "type the cluster name to confirm: " answer
[ "$answer" = "$(jq -r '.cluster.name' terraform/proxmox/cluster.auto.tfvars.json)" ] || { echo "aborted"; exit 1; }

for ip in $(jq -r '.nodes[].ip' terraform/proxmox/cluster.auto.tfvars.json); do
  echo "==> $ip"
  talosctl -n "$ip" reset --graceful=false --reboot --wait=false || true
done
echo "nodes rebooting into maintenance mode — re-run 'mise run proxmox:apply' to rebuild"
"""

[tasks."nfs:status"]
description = "NFS server: export list, free space, and whether the StorageClass agrees"
run = "scripts/nfs-status.sh"

[tasks."tailscale:init"]
description = "terraform init for the tailnet policy root"
run = "scripts/tf.sh tailscale init"

[tasks."tailscale:plan"]
description = "Plan the tailnet policy file"
run = "scripts/tf.sh tailscale plan"

[tasks."tailscale:apply"]
description = "Apply the tailnet policy file (CI does this on push to main)"
run = "scripts/tf.sh tailscale apply"

[tasks."tailscale:status"]
description = "The in-cluster subnet router and the operator's proxies"
run = "kubectl -n tailscale get connector,pods -o wide"

[tasks.status]
description = "Show nodes and control-plane pods"
shell = "bash -c"
run = """
kubectl get nodes -o wide
echo
kubectl -n kube-system get pods
"""

[tasks.bootstrap]
description = "Full path: VMs -> machine configs -> bootstrap -> Cilium -> status"
shell = "bash -c"
run = """
set -euo pipefail
mise run proxmox:apply
mise run talosconfig
mise run kubeconfig
mise run cilium
mise run status
"""
