ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

socketLB:
  hostNamespaceOnly: true

hubble:
  enabled: true
  tls:
    auto:
      method: cronJob
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
    serviceMonitor:
      enabled: true
    # The chart's four Hubble dashboards, as ConfigMaps the Grafana sidecar
    # picks up (searchNamespace: ALL, so kube-system is fine).
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

# Talos mounts cgroupv2 and bpffs itself and will not let Cilium do it again.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# The stock list minus SYS_MODULE: Talos does not allow workloads to load
# kernel modules, and the agent crash-loops if it asks for the capability.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
