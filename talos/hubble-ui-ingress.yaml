apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
  labels:
    k8s-app: hubble-ui
  # Served by the ingress ProxyGroup in apps/base/tailscale-ingress/ as
  # svc:hubble, not by a proxy device of its own.
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hubble
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
