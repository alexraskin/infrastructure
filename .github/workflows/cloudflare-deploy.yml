name: "Cloudflare: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  pull_request:
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  terraform:
    name: "cloudflare"
    runs-on: ubuntu-latest

    environment: cloudflare
    defaults:
      run:
        working-directory: ./terraform/cloudflare
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # Object Storage 404s the state backend spuriously; the SDK's retries help
      OCI_SDK_DEFAULT_RETRY_ENABLED: "true"

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # State lives in the OCI bucket 00-global/ owns. These reach both the
      # backend (via scripts/tf-init.sh) and the terraform_remote_state data
      # source that reads the proxmox root.
      TF_VAR_oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_oci_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_oci_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_oci_namespace: ${{ secrets.OCI_NAMESPACE }}
      TF_VAR_oci_region: ${{ secrets.OCI_REGION }}
      # scripts/oci-env.sh defaults this to secrets/oci_api_key.pem, but the
      # plan and apply steps do not source it — only tf-init.sh does.
      TF_VAR_oci_private_key_path: ${{ github.workspace }}/secrets/oci_api_key.pem

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15"
          terraform_wrapper: false

      - name: Write tfvars
        run: printf '%s\n' "$CI_TFVARS" > ci.auto.tfvars
        env:
          CI_TFVARS: ${{ secrets.CLOUDFLARE_TFVARS }}

      - name: Write the OCI signing key
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p secrets
          umask 077
          printf '%s\n' "$OCI_API_KEY" > secrets/oci_api_key.pem
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}

      - name: Terraform Init
        run: ${{ github.workspace }}/scripts/tf-init.sh --force terraform/cloudflare

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          "${{ github.workspace }}/scripts/tf-run.sh" plan -out .planfile -input=false -no-color > plan.txt 2>&1 || {
            echo "::error::terraform plan failed"
            exit 1
          }
          grep -E "^(Plan:|No changes\.)" plan.txt | tail -n 1

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: |
          "${{ github.workspace }}/scripts/tf-run.sh" apply -auto-approve -input=false -no-color .planfile > apply.txt 2>&1 || {
            echo "::error::terraform apply failed; output withheld (public logs)"
            exit 1
          }
          grep -E "^Apply complete!" apply.txt
