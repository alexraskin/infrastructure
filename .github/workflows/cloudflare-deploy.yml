name: "Cloudflare: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  pull_request:
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  terraform:
    name: "cloudflare"
    runs-on: ubuntu-latest

    environment: cloudflare
    defaults:
      run:
        working-directory: ./terraform/cloudflare
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # Object Storage 404s the state backend spuriously; the SDK's retries help
      OCI_SDK_DEFAULT_RETRY_ENABLED: "true"

      # Every credential comes out of secrets.sops.yaml, which this key opens
      # and nothing else does — see docs/terraform-sops.md.
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SOPS_VERSION: "3.13.3"
      SOPS_SHA256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15"
          terraform_wrapper: false

      - name: Write tfvars
        run: printf '%s\n' "$CI_TFVARS" > ci.auto.tfvars
        env:
          CI_TFVARS: ${{ secrets.CLOUDFLARE_TFVARS }}

      - name: Install sops
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Terraform Init
        run: ${{ github.workspace }}/scripts/tf.sh cloudflare init

      - name: Terraform Validate
        run: terraform validate

      # Plan only, deliberately. terraform.tfvars is not committed, so CI plans
      # against CLOUDFLARE_TFVARS, and whenever that copy lags the local one the
      # plan proposes deleting the DNS records it cannot see. Apply from a
      # workstation until the inputs live in one place.
      - name: Terraform Plan
        run: |
          "${{ github.workspace }}/scripts/tf.sh" cloudflare plan -input=false -no-color > plan.txt 2>&1 || {
            echo "::error::terraform plan failed"
            exit 1
          }
          grep -E "^(Plan:|No changes\.)" plan.txt | tail -n 1

          if grep -qE "^Plan: .*[1-9][0-9]* to destroy" plan.txt; then
            echo "::warning::this plan destroys resources — check CLOUDFLARE_TFVARS is current"
          fi
