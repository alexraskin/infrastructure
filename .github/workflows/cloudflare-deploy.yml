name: "Cloudflare: plan"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  terraform:
    name: "cloudflare"
    runs-on: ubuntu-latest

    environment: cloudflare
    defaults:
      run:
        working-directory: ./terraform/cloudflare
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15"
          terraform_wrapper: false

      - name: Write tfvars
        run: printf '%s\n' "$CI_TFVARS" > ci.auto.tfvars
        env:
          CI_TFVARS: ${{ secrets.CLOUDFLARE_TFVARS }}

      - name: Terraform Init
        run: ${{ github.workspace }}/scripts/tf.sh cloudflare init

      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: |
          "${{ github.workspace }}/scripts/tf.sh" cloudflare plan -input=false -no-color > plan.txt 2>&1 || {
            echo "::error::terraform plan failed"
            exit 1
          }
          grep -E "^(Plan:|No changes\.)" plan.txt | tail -n 1

          if grep -qE "^Plan: .*[1-9][0-9]* to destroy" plan.txt; then
            echo "::warning::this plan destroys resources — check CLOUDFLARE_TFVARS is current"
          fi
