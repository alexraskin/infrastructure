name: "Cloudflare: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  pull_request:
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  terraform:
    name: "cloudflare"
    runs-on: ubuntu-latest

    environment: cloudflare
    defaults:
      run:
        working-directory: ./terraform/cloudflare
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.R2_S3_ENDPOINT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9"
          terraform_wrapper: false

      - name: Write tfvars
        run: printf '%s\n' "$CI_TFVARS" > ci.auto.tfvars
        env:
          CI_TFVARS: ${{ secrets.CLOUDFLARE_TFVARS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -out .planfile -input=false -no-color > plan.txt 2>&1 || {
            echo "::error::terraform plan failed"
            exit 1
          }
          grep -E "^(Plan:|No changes\.)" plan.txt | tail -n 1

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: |
          terraform apply -auto-approve -input=false -no-color .planfile > apply.txt 2>&1 || {
            echo "::error::terraform apply failed; output withheld (public logs)"
            exit 1
          }
          grep -E "^Apply complete!" apply.txt
