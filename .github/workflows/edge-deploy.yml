name: "Edge: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "01-cloud-edge/**"
      - ".github/workflows/edge-deploy.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run nixos-rebuild switch on the box"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  deploy:
    name: "edge"
    runs-on: ubuntu-latest
    environment: edge
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch what the runner needs
        run: |
          get() { aws ssm get-parameter --with-decryption --name "/infrastructure/edge/$1" --query Parameter.Value --output text; }
          get edge_json > 01-cloud-edge/edge.json
          key=$(get tailscale_ci_authkey)
          echo "::add-mask::$key"
          echo "TS_AUTHKEY=$key" >> "$GITHUB_ENV"
      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ env.TS_AUTHKEY }}
          tailscaled-args: "--statedir=/tmp/tailscale-state"

      - name: Resolve the edge address
        run: |
          ip=$(01-cloud-edge/scripts/edge-addr.sh)
          echo "::add-mask::$ip"
          echo "EDGE_IP=$ip" >> "$GITHUB_ENV"

      - name: Deploy
        if: github.event_name == 'push' || inputs.apply
        run: 01-cloud-edge/scripts/deploy.sh "$EDGE_IP"

      - name: Status
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR "root@$EDGE_IP" '
            systemctl is-active haproxy
            systemctl is-active tailscaled
            printf "acme certs: %s\n" "$(ls /var/lib/acme 2>/dev/null | wc -l)"
          '
