name: "Tailscale: deploy"

on:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - ".github/workflows/tailscale-deploy.yml"
  pull_request:
    paths:
      - "tailscale/**"
      - ".github/workflows/tailscale-deploy.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (dangerous)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tailscale
  cancel-in-progress: false

jobs:
  terraform:
    name: "tailscale"
    runs-on: ubuntu-latest

    environment: tailscale
    defaults:
      run:
        working-directory: ./tailscale
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # Object Storage 404s the state backend spuriously; the SDK's retries help
      OCI_SDK_DEFAULT_RETRY_ENABLED: "true"

      TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}

      # Every credential comes out of secrets.sops.yaml, which this key opens
      # and nothing else does — see docs/terraform-sops.md.
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SOPS_VERSION: "3.13.3"
      SOPS_SHA256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15"
          terraform_wrapper: false

      - name: Install sops
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Terraform Init
        run: ${{ github.workspace }}/scripts/tf.sh tailscale init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: ${{ github.workspace }}/scripts/tf.sh tailscale plan -out .planfile -input=false

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: ${{ github.workspace }}/scripts/tf.sh tailscale apply -auto-approve -input=false .planfile
