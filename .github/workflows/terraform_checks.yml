name: "Terraform: checks"

on:
  push:
    branches:
      - main
    paths:
      - "00-global/**"
      - "01-cloud-edge/terraform/**"
      - "tailscale/**"
      - "terraform/**"
      - ".tflint.hcl"
      - ".terraform-docs.yml"
      - ".pre-commit-config.tfdocs.yml"
      - ".github/workflows/terraform_checks.yml"
  pull_request:
    paths:
      - "00-global/**"
      - "01-cloud-edge/terraform/**"
      - "tailscale/**"
      - "terraform/**"
      - ".tflint.hcl"
      - ".terraform-docs.yml"
      - ".pre-commit-config.tfdocs.yml"
      - ".github/workflows/terraform_checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15"
  TFLINT_VERSION: "v0.64.0"

jobs:
  fmt:
    name: "fmt"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

  checks:
    name: "${{ matrix.dir }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dir:
          - 00-global
          - 01-cloud-edge/terraform
          - tailscale
          - terraform/cloudflare
          - terraform/oracle
          - terraform/proxmox

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # edge.json is gitignored, and network.tf reads it with file() — without a
      # stand-in, validate fails on a file CI is never given.
      - name: Stand in for the gitignored edge.json
        if: matrix.dir == '01-cloud-edge/terraform'
        working-directory: ${{ github.workspace }}
        run: cp 01-cloud-edge/edge.json.example 01-cloud-edge/edge.json

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Cache tflint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ env.TFLINT_VERSION }}-${{ hashFiles('.tflint.hcl') }}

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install tflint plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: tflint
        run: tflint --format=compact --no-color

      - name: Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dir }}
          skip-dirs: "**/.terraform"
          exit-code: "1"

  # README.md is generated. Regenerate with `mise run tfdocs`, never by hand.
  docs:
    name: "terraform-docs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: terraform-docs is up to date
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: 00-global,01-cloud-edge/terraform,tailscale,terraform/cloudflare,terraform/oracle,terraform/proxmox
          config-file: .pre-commit-config.tfdocs.yml
          output-file: README.md
          output-method: inject
          fail-on-diff: true
