services:
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:telegraf
    container_name: ultrafeeder
    hostname: ultrafeeder
    restart: always
    device_cgroup_rules:
      - 'c 189:* rwm'
    ports:
      - 8080:80
      - 9273-9274:9273-9274
    environment:
      - TZ=America/Phoenix
      - PROMETHEUS_ENABLE=true
      - TAR1090_ENABLE_AC_DB=true
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_GAIN=autogain
      - READSB_LAT=
      - READSB_LON=
      - READSB_ALT=350m
      - MLAT_USER=alexraskin
      - UUID=bec05b31-8c3e-4a85-aec3-440d4fe00c0a
      - ULTRAFEEDER_CONFIG=adsb,feed.adsb.fi,30004,beast_reduce_plus_out;adsb,in.adsb.lol,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090,39000;mlat,in.adsb.lol,31090,39001
    volumes:
      - /opt/adsb/globe_history:/var/globe_history
      - /opt/adsb/graphs1090:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=256M
      - /tmp:size=128M
      - /var/log:size=32M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/30005' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  fr24feed:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
    container_name: fr24feed
    restart: always
    depends_on:
      ultrafeeder:
        condition: service_healthy
    ports:
      - 8754:8754
    environment:
      - BEASTHOST=ultrafeeder
      - BEASTPORT=30005
      - FR24KEY=
    dns_search: .