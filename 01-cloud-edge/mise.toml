[tools]
terraform = "1.15"
jq = "latest"
sops = "latest"

[env]
SSH_OPTS = "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null"
SOPS_AGE_KEY_FILE = "{{config_root}}/../secrets/age.key"

OCI_SDK_DEFAULT_RETRY_ENABLED = "true"

# --------------------------------------------------------------- terraform ---

[tasks."edge:init"]
description = "terraform init, re-resolving providers"
run = "../scripts/tf.sh edge init"

[tasks."edge:plan"]
description = "Plan the VCN, instance and DNS records"
run = "../scripts/tf.sh edge plan"

[tasks."edge:apply"]
description = "Create the edge instance, walking the availability domains on capacity errors"
run = "../scripts/tf.sh edge apply"

[tasks."edge:destroy"]
description = "Destroy the instance, its network and its DNS records"
run = "../scripts/tf.sh edge destroy"

[tasks.ip]
description = "The instance's current public IP"
shell = "bash -c"
run = """
set -euo pipefail
../scripts/tf.sh edge output -raw public_ip
echo
"""

# ------------------------------------------------------------------- nixos ---

[tasks.install]
description = "One-shot: nixos-anywhere replaces Ubuntu with NixOS (erases the box)"
run = "scripts/install.sh"

[tasks."secrets:edit"]
description = "Decrypt the box's secrets into $EDITOR and re-encrypt on save"
shell = "bash -c"
run = "exec sops nixos/hosts/oracle-edge/secrets.sops.yaml"

[tasks."secrets:show"]
description = "Print the decrypted secrets"
shell = "bash -c"
run = "exec sops --decrypt nixos/hosts/oracle-edge/secrets.sops.yaml"

[tasks."push-age-key"]
description = "The age key sops-nix decrypts the box's secrets with"
run = "scripts/push-age-key.sh"

[tasks.deploy]
description = "Push this flake and nixos-rebuild switch (builds on the box)"
run = "scripts/deploy.sh"

[tasks.ssh]
description = "SSH to the edge box"
shell = "bash -c"
usage = 'arg "[host]" help="tailscale name or IP; defaults to the terraform output"'
run = """
set -euo pipefail
exec ssh $SSH_OPTS "root@$(scripts/edge-addr.sh "${usage_host:-}")"
"""

[tasks.status]
description = "Tailscale, HAProxy, certs and backend reachability, as the box sees them"
shell = "bash -c"
usage = 'arg "[host]" help="tailscale name or IP; defaults to the terraform output"'
run = """
set -euo pipefail
ip=$(scripts/edge-addr.sh "${usage_host:-}")
ssh $SSH_OPTS "root@$ip" '
  echo "--- tailscale"
  tailscale status --peers=false || true
  echo
  echo "--- haproxy"
  systemctl is-active haproxy
  echo
  echo "--- certs"
  ls /var/lib/acme 2>/dev/null || echo "none issued yet"
  echo
  echo "--- backends"
  jq -r ".sites[] | .backend" /etc/nixos-edge/edge.json | while read -r hp; do
    printf "%-24s " "$hp"
    timeout 3 bash -c "cat < /dev/null > /dev/tcp/${hp%%:*}/${hp##*:}" \\
      && echo reachable || echo UNREACHABLE
  done
'
"""

[tasks.check]
description = "Evaluate the flake — does this NixOS config build at all"
shell = "bash -c"
run = """
set -euo pipefail
../scripts/nix.sh 'nix eval --raw "path:./01-cloud-edge#nixosConfigurations.cloud-edge.config.system.build.toplevel.drvPath"'
echo
"""
