# The shape of secrets.sops.yaml, which is committed encrypted alongside this
# file. To change a value:
#
#   cd 00-cloud-edge && mise run secrets:edit
#
# Do not reach for `sops` by hand from another directory — it resolves
# .sops.yaml from the working directory, and apps/ has a different one. See
# 00-cloud-edge/CLAUDE.md.

# Tagged pre-auth key from the tailnet admin console.
tailscale_authkey: tskey-auth-REPLACE

# Cloudflare token scoped to Zone:DNS:Edit on the zone in edge.json. The same
# value as secrets/cloudflare-api-token, which terraform/cloudflare/ still reads
# from disk — this is a second copy, not a move.
cloudflare_dns_api_token: REPLACE
