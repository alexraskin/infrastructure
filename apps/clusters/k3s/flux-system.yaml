# Where Flux syncs from. Committed by hand instead of generated by
# `flux bootstrap`, which would need a GitHub PAT to push these manifests and
# create a deploy key. The repo is public, so the controllers read it
# anonymously over HTTPS — no token, no deploy key, no credentials in-cluster.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/alexraskin/infrastructure.git
  ref:
    branch: main
---
# Reconciles this directory, which is what pulls in apps.yaml below it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/clusters/k3s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
