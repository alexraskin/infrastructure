# What Flux reconciles on this cluster. flux bootstrap writes flux-system/ next
# to this file; everything else the cluster runs is listed here.
# Kept separate from the app Kustomizations, and depended on by none of them:
# it needs the two extra controllers, and if those are missing this is the only
# thing that fails.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/cloudflared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alexraskin-com
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/alexraskin-com
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cloudflared
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: go-vanityurls
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/go-vanityurls
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cloudflared
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lastfm-now-playing
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/lastfm-now-playing
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cloudflared
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lhbotgo
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/lhbotgo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No dependsOn cloudflared: the bot dials Discord out, nothing dials in.
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No dependsOn cloudflared: Grafana is reached over the tailnet on a NodePort,
  # nothing enters through the tunnel.
  wait: true
  # The chart installs CRDs and five workloads on first run, and Prometheus
  # waits on a local-path PVC — 3m is not enough here.
  timeout: 15m
