# What Flux reconciles on this cluster. flux bootstrap writes flux-system/ next
# to this file; everything else the cluster runs is listed here.
# Kept separate from the app Kustomizations, and depended on by none of them:
# it needs the two extra controllers, and if those are missing this is the only
# thing that fails.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/cloudflared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alexraskin-com
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/alexraskin-com
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cloudflared
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: go-vanityurls
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/go-vanityurls
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cloudflared
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lastfm-now-playing
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/lastfm-now-playing
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cloudflared
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lhbotgo
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/lhbotgo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No dependsOn cloudflared: the bot dials Discord out, nothing dials in.
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/tailscale-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Owns the `tailscale` IngressClass and the proxies that back it. monitoring
  # depends on this; nothing here depends on cloudflared.
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No dependsOn cloudflared: Grafana is reached over the tailnet, nothing
  # enters through the tunnel. It does need the operator, which owns the
  # `tailscale` IngressClass its Ingress names.
  dependsOn:
    - name: tailscale-operator
  wait: true
  # The chart installs CRDs and five workloads on first run, and Prometheus
  # waits on a local-path PVC — 3m is not enough here.
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/loki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Logs go to R2, not through the tunnel, so no dependsOn cloudflared. The
  # Grafana datasource ConfigMap here is read by the monitoring stack's sidecar,
  # which is a label lookup, not an ordering dependency.
  #
  # tailscale-operator is an ordering dependency though: ingress.yaml puts Loki
  # on the tailnet for the edge node, and an Ingress whose IngressClass does not
  # exist yet is accepted and then never reconciled.
  dependsOn:
    - name: tailscale-operator
  wait: true
  # Chart install plus a local-path PVC for the WAL.
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/alloy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Ships into Loki's push endpoint; starting first just fills its buffer with
  # failed sends.
  dependsOn:
    - name: loki
  wait: true
  timeout: 5m
