# Where Flux syncs from. Committed by hand instead of generated by
# `flux bootstrap`, which would push these manifests to the repo itself.
#
# SSH rather than anonymous HTTPS because image-automation-controller *writes*
# to this repo — it bumps image tags under apps/base and pushes the commit.
# `flux-git-auth` holds a deploy key with write access; create it with
# `mise run git-deploy-key` and register the printed public key on GitHub.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/alexraskin/infrastructure.git
  secretRef:
    name: flux-git-auth
  ref:
    branch: main
---
# Reconciles this directory, which is what pulls in apps.yaml below it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/clusters/talos
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
