apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    # Every controller serves its metrics on this port under the same name.
    - port: http-prom
      interval: 60s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: controller
