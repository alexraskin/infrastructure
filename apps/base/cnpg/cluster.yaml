# The Postgres cluster: one instance per db node, which is why there are three
# db nodes and three db-local PVs.
#
# Scheduling is the whole reason this file is not generic. The db nodes carry
# `dedicated=database:NoSchedule` (set by kubelet in terraform/proxmox/talos.tf),
# so a workload lands there only if it both tolerates the taint *and* selects the
# label — neither alone is enough. Anti-affinity then keeps the three instances
# on three separate nodes; without it two could share one node and lose the
# point of the replicas.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: cnpg-system
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6

  # The operator promotes a replica on its own when the primary goes away.
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: app
      owner: app
      # The operator generates postgres-app with the password; nothing to commit.

  storage:
    size: 90Gi
    storageClass: db-local

  # Storage is node-local and there is no backup configured — losing a db node's
  # disk loses that instance's copy. Two replicas remain, so the *cluster*
  # survives; a full restore would not. `backup.barmanObjectStore` against R2 is
  # the fix when this holds anything worth keeping.

  postgresql:
    parameters:
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      work_mem: 8MB
      maintenance_work_mem: 128MB
      max_connections: "200"

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      dedicated: database
    tolerations:
      - key: dedicated
        operator: Equal
        value: database
        effect: NoSchedule

  monitoring:
    enablePodMonitor: true
