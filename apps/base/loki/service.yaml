# Loki on the tailnet for the edge node. LoadBalancer, not Ingress: plain TCP on
# 3100, so the edge can push to the bare MagicDNS name. See CLAUDE.md.
apiVersion: v1
kind: Service
metadata:
  name: loki-tailnet
  namespace: logging
  annotations:
    # Fixes the device name, and therefore the URL.
    tailscale.com/hostname: "loki"
    tailscale.com/tags: "tag:k8s-loki"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: http-metrics
