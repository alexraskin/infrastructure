# Puts Loki's push/query API on the tailnet, so the Oracle edge node in
# 00-edge-compute/ can ship its journal here. Nothing in the cluster uses this
# path — Grafana and Alloy both talk to svc/loki:3100 directly, and the
# datasource in datasource.yaml is unchanged.
#
# Same operator mechanism as the Grafana Ingress in apps/base/monitoring/: no
# host in the rules, exactly one entry in tls.hosts, and the device name comes
# from tls.hosts[0]. Needs MagicDNS and HTTPS Certificates on in the tailnet
# admin console.
#
#   https://loki.<tailnet>.ts.net/loki/api/v1/push
#
# The tag is the load-bearing part. Left to itself the operator tags this proxy
# tag:k8s, which every other proxy also carries — so the ACL grant letting the
# edge reach Loki would let it reach Grafana too. tag:k8s-loki exists to make
# that grant addressable at one service. tailscale/policy.hujson must own it
# under tag:k8s-operator or the operator's device creation is rejected outright.
#
# Loki runs auth_enabled: false, so anything the ACL lets in can push, query and
# delete. tag:edge is the only src granted, and it only ever pushes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki
  namespace: logging
  annotations:
    tailscale.com/tags: "tag:k8s-loki"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
  tls:
    - hosts:
        - loki
