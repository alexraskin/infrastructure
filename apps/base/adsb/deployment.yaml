apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultrafeeder
  namespace: adsb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultrafeeder
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ultrafeeder
    spec:
      hostname: ultrafeeder
      nodeSelector:
        kubernetes.io/hostname: talos-worker-2
      containers:
        - name: ultrafeeder
          image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:telegraf
          envFrom:
            - secretRef:
                name: adsb-env
          env:
            - { name: TZ, value: America/Phoenix }
            - { name: PROMETHEUS_ENABLE, value: "true" }
            - { name: TAR1090_ENABLE_AC_DB, value: "true" }
            - { name: READSB_DEVICE_TYPE, value: rtlsdr }
            - { name: READSB_GAIN, value: autogain }
            - { name: READSB_ALT, value: 350m }
            - { name: MLAT_USER, value: alexraskin }
            - { name: UUID, value: bec05b31-8c3e-4a85-aec3-440d4fe00c0a }
            - name: ULTRAFEEDER_CONFIG
              value: "adsb,feed.adsb.fi,30004,beast_reduce_plus_out;adsb,in.adsb.lol,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090,39000;mlat,in.adsb.lol,31090,39001"
          ports:
            - { name: http, containerPort: 80 }
            - { name: telegraf, containerPort: 9273 }
            - { name: readsb-metrics, containerPort: 9274 }
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - { name: usb, mountPath: /dev/bus/usb }
            - { name: data, mountPath: /var/globe_history, subPath: globe_history }
            - { name: data, mountPath: /var/lib/collectd, subPath: graphs1090 }
            - { name: run, mountPath: /run }
            - { name: tmp, mountPath: /tmp }
            - { name: log, mountPath: /var/log }
        - name: fr24feed
          image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
          envFrom:
            - secretRef:
                name: adsb-env
          env:
            - { name: BEASTHOST, value: 127.0.0.1 }
            - { name: BEASTPORT, value: "30005" }
            - { name: BIND_INTERFACE, value: 0.0.0.0 }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: data
          persistentVolumeClaim:
            claimName: adsb-data
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
        - name: log
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
