apiVersion: v1
kind: Service
metadata:
  name: ultrafeeder
  namespace: adsb
spec:
  selector:
    app: ultrafeeder
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: telegraf, port: 9273, targetPort: telegraf }
    - { name: readsb-metrics, port: 9274, targetPort: readsb-metrics }
