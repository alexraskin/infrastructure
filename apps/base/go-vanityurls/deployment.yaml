apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-vanityurls
  namespace: vanityurls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-vanityurls
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: go-vanityurls
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: go-vanityurls
      containers:
        - name: web
          # Tag is maintained by Flux image automation — see
          # base/image-automation/. Do not edit it by hand; a manual change is
          # reverted on the next scan.
          image: ghcr.io/alexraskin/go-vanityurls:1.0.0 # {"$imagepolicy": "flux-system:go-vanityurls"}
          args: ["-port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          # The binary serves an embedded FS with no health endpoint; the
          # generated index at / is the only thing to probe.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
