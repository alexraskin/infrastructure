apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      # Pinned by hand. Promtail is deliberately not used here: it is EOL and its
      # chart still ships Loki 3.5.
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-alloy
        namespace: logging
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # DaemonSet is the chart default; every node ships its own logs.
    controller:
      type: daemonset

    alloy:
      # Mounts /var/log from the host, which is what makes /var/log/journal
      # reachable for loki.source.journal below.
      mounts:
        varlog: true

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      configMap:
        content: |-
          // Pod logs come from the Kubernetes API rather than by tailing files
          // under /var/log/pods: no symlink-chasing, no CRI log-format parsing,
          // and the chart's ClusterRole already grants pods/log.
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          // The half that earns its keep: k3s, tailscaled, sshd and kernel
          // messages, visible in Grafana without SSHing to a node.
          loki.source.journal "host" {
            max_age    = "12h"
            path       = "/var/log/journal"
            labels     = {
              job = "systemd-journal",
            }
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
