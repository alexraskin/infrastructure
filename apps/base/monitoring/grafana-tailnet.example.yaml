# Template only. Holds the one thing about this setup that is deliberately not
# in a public repo: the tailnet name. Grafana needs it to build absolute URLs,
# and the values must match the name the tailscale operator serves it on —
# <tls.hosts[0] from the Ingress>.<your tailnet>.ts.net.
#
# Find it with:  tailscale status --json | jq -r .MagicDNSSuffix
#
#   cp grafana-tailnet.example.yaml grafana-tailnet.sops.yaml
#   $EDITOR grafana-tailnet.sops.yaml
#   cd apps && mise exec -- sops --encrypt --in-place base/monitoring/grafana-tailnet.sops.yaml
#
# The trailing slash on root-url is not optional — Grafana appends paths to it.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-tailnet
  namespace: monitoring
type: Opaque
stringData:
  domain: grafana.tailnet.ts.net
  root-url: https://grafana.tailnet.ts.net/
