# The first Helm source in this repo. helm-controller ships with `flux install`
# by default, so nothing extra had to be installed for this.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
