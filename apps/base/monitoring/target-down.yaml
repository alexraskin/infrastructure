apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: target-down
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: general.rules.local
      rules:
        - alert: TargetDown
          expr: |
            100 * (
              count by (cluster, job, namespace, service) (up == 0)
                / count by (cluster, job, namespace, service) (up)
            ) > 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ printf \"%.4g\" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} have been down for 30m"
            description: "Long enough that a Flux rollout is not the explanation — check the pod and its scrape endpoint."
