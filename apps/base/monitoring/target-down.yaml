apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: target-down
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: general.rules.local
      rules:
        # The chart's TargetDown, with a 30m fuse instead of 10m. Same expression:
        # more than 10% of a job's targets down, which for a single-pod job means
        # the one pod. A rollout that has not finished in half an hour is stuck,
        # not reconciling.
        - alert: TargetDown
          expr: |
            100 * (
              count by (cluster, job, namespace, service) (up == 0)
                / count by (cluster, job, namespace, service) (up)
            ) > 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ printf \"%.4g\" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} have been down for 30m"
            description: "Long enough that a Flux rollout is not the explanation — check the pod and its scrape endpoint."
