# Picked up by the Grafana sidecar because of the grafana_dashboard label — no
# Grafana restart, no UI import, it appears within ~30s of reconcile.
#
# Deliberately minimal: it only uses `up`, which exists no matter what the Plex
# exporter emits, so it proves the scrape works. Add real panels once the
# endpoint's metric names are known:
#   kubectl -n monitoring exec -it prometheus-kube-prometheus-stack-prometheus-0 \
#     -c prometheus -- wget -qO- localhost:9090/api/v1/label/__name__/values \
#     | tr ',' '\n' | grep -i plex
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-plex
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  plex.json: |
    {
      "title": "Plex",
      "uid": "plex-scrape",
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "Exporter reachable",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up{job=\"plex-exporter\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red", "index": 0 } } },
                { "type": "value", "options": { "1": { "text": "UP", "color": "green", "index": 1 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Scrape duration",
          "gridPos": { "h": 5, "w": 18, "x": 6, "y": 0 },
          "targets": [
            { "expr": "scrape_duration_seconds{job=\"plex-exporter\"}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        }
      ]
    }
