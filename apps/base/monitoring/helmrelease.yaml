apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 24h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultRules:
      disabled:
        # Replaced by a longer-fused copy in target-down.yaml: most jobs here have
        # one pod, so any Flux rollout is 100% of the job down and the chart's
        # 10m fuse turns every reconcile into a page.
        TargetDown: true

    kubeControllerManager:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeEtcd:
      enabled: true
    kubeProxy:
      enabled: false
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "id"]
          group_wait: 1m
          group_interval: 5m
          repeat_interval: 12h
          receiver: telegram
          routes:
            # Watchdog always fires. Pinging a dead man's switch with it means
            # silence — dead cluster, dead Prometheus, dead Alertmanager — is
            # itself the alert, which nothing inside the cluster can tell you.
            - receiver: deadman
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 5m
              repeat_interval: 5m
        receivers:
          - name: deadman
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-deadman/url
                send_resolved: false
          - name: telegram
            telegram_configs:
              # Both come from the mounted alertmanager-telegram Secret; nothing
              # about the chat is in git.
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                parse_mode: HTML
                send_resolved: true
                message: |-
                  {{ range .Alerts }}<b>[{{ .Status | toUpper }}] {{ .Labels.alertname }}</b>
                  {{ .Annotations.summary }}
                  {{ with .Annotations.description }}{{ . }}
                  {{ end }}{{ end }}
      alertmanagerSpec:
        secrets:
          - alertmanager-telegram
          - alertmanager-deadman
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
    prometheus-node-exporter:
      hostNetwork: true

    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 15GiB
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

        additionalScrapeConfigs:
          - job_name: plex-exporter
            metrics_path: /metrics
            static_configs:
              - targets: ["10.0.200.87:9001"]
                labels:
                  instance: plex

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: tailscale
        # Same ingress ProxyGroup as gatus — published as svc:grafana, served by
        # every replica instead of one proxy device.
        annotations:
          tailscale.com/proxy-group: ingress
        hosts: []
        tls:
          - hosts:
              - grafana
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
        datasources:
          enabled: true
          searchNamespace: ALL
      persistence:
        enabled: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

      envValueFrom:
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-db
            key: password
        GF_SERVER_DOMAIN:
          secretKeyRef:
            name: grafana-tailnet
            key: domain
        GF_SERVER_ROOT_URL:
          secretKeyRef:
            name: grafana-tailnet
            key: root-url

      grafana.ini:
        database:
          type: postgres
          host: postgres-rw.cnpg-system.svc.cluster.local:5432
          name: grafana
          user: grafana
          ssl_mode: require

        analytics:
          reporting_enabled: false
          check_for_updates: false
