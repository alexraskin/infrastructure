apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 24h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    kubeControllerManager:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeEtcd:
      enabled: true
    kubeProxy:
      enabled: false
    alertmanager:
      enabled: false
    prometheus-node-exporter:
      hostNetwork: true

    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 15GiB
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

        additionalScrapeConfigs:
          - job_name: plex-exporter
            metrics_path: /metrics
            static_configs:
              - targets: ["10.0.200.87:9001"]
                labels:
                  instance: plex

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: tailscale
        # Same ingress ProxyGroup as gatus — published as svc:grafana, served by
        # every replica instead of one proxy device.
        annotations:
          tailscale.com/proxy-group: ingress
        hosts: []
        tls:
          - hosts:
              - grafana
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
        datasources:
          enabled: true
          searchNamespace: ALL
      persistence:
        enabled: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

      envValueFrom:
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-db
            key: password
        GF_SERVER_DOMAIN:
          secretKeyRef:
            name: grafana-tailnet
            key: domain
        GF_SERVER_ROOT_URL:
          secretKeyRef:
            name: grafana-tailnet
            key: root-url

      grafana.ini:
        database:
          type: postgres
          host: postgres-rw.cnpg-system.svc.cluster.local:5432
          name: grafana
          user: grafana
          ssl_mode: require

        analytics:
          reporting_enabled: false
          check_for_updates: false
