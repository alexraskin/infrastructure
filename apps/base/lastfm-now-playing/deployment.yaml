apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastfm-now-playing
  namespace: lastfm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lastfm-now-playing
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lastfm-now-playing
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lastfm-now-playing
      containers:
        - name: api
          # Tag is maintained by Flux image automation — see
          # base/image-automation/. Do not edit it by hand; a manual change is
          # reverted on the next scan.
          image: ghcr.io/alexraskin/lastfm-now-playing:1.0.1 # {"$imagepolicy": "flux-system:lastfm-now-playing"}
          args: ["-port", "3000"]
          env:
            - name: LASTFM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lastfm-api-key
                  key: api-key
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
