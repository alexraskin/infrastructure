---
# The db nodes' second disk — a real partition, not a directory volume, mounted
# by Talos at /var/mnt/db. CloudNativePG claims these: three interchangeable
# volumes for three interchangeable Postgres instances.
#
# Deliberately **no claimRef here**, unlike the local-path volumes above. CNPG
# names its claims postgres-1..3 but does not choose which instance lands on
# which node, so pinning postgres-2 to this node's volume would deadlock
# whenever the scheduler disagreed. They are identical in size and class, so
# first-come binding is correct — at the cost of a Released volume needing its
# claimRef cleared by hand if a claim is ever deleted.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-local-1
spec:
  capacity:
    storage: 90Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: db-local
  local:
    path: /var/mnt/db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-db-1]
---
