# Static PVs, one per claim in the cluster. `hostPath` with DirectoryOrCreate
# is what the Talos local-storage guide documents: kubelet creates the
# directory, and nodeAffinity is what makes the volume honest about being
# node-local. A PV in a pod spec is only ever a PVC reference, so this does not
# meet Talos' PodSecurity baseline, which would reject a hostPath volume.
#
# Adding a claim means adding a PV here first — nothing provisions on demand.
# /var is the Talos EPHEMERAL partition: it survives reboots and upgrades, but
# not `talosctl reset` or a reinstall.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-path-prometheus
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /var/mnt/local-path/prometheus
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-worker-1]
---
