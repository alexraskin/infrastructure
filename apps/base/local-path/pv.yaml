---
# The db nodes' second disk — a real partition, not a directory volume, mounted
# by Talos at /var/mnt/db. Nothing claims these yet: a workload has to tolerate
# dedicated=database:NoSchedule and ask for storageClassName: db-local.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-local-1
spec:
  capacity:
    storage: 90Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: db-local
  local:
    path: /var/mnt/db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-db-1]
