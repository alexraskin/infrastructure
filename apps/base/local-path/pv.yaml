# The db nodes' second disk, mounted by Talos at /var/mnt/db. Nothing claims
# these yet: a workload has to tolerate dedicated=database:NoSchedule and ask
# for storageClassName: db-local.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-local-1
spec:
  capacity:
    storage: 90Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: db-local
  hostPath:
    path: /var/mnt/db/data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-db-1]
---
