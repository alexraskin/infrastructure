# Static PVs, one per claim in the cluster. Each binds a Talos **user volume**
# declared in terraform/proxmox/talos.tf and mounted at /var/mnt/<name>, so
# adding a claim is a PV here *and* a volume there — nothing provisions on
# demand, and /var/mnt is read-only to anything but Talos.
#
# `local`, not `hostPath`, and the difference is load-bearing: kubelet applies
# fsGroup ownership to a local volume, so a chart running as a non-root uid can
# write to it. A hostPath PV stays root-owned and Prometheus dies on
# "open /prometheus/queries.active: permission denied".
#
# nodeAffinity is what makes the volume honest about being node-local. These
# live on the EPHEMERAL partition: they survive reboots and upgrades, but not
# `talosctl reset` or a reinstall.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-path-prometheus
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  local:
    path: /var/mnt/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-worker-1]
