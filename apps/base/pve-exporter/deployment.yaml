apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pve-exporter
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pve-exporter
    spec:
      containers:
        - name: exporter
          image: prompve/prometheus-pve-exporter:3.10.0
          env:
            # No config file: pve_exporter reads its default module from these.
            - name: PVE_USER
              valueFrom:
                secretKeyRef:
                  name: pve-exporter
                  key: user
            - name: PVE_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: pve-exporter
                  key: token-name
            - name: PVE_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: pve-exporter
                  key: token-value
            # The PVE cert is the ACME one for pve_fqdn, and the target is an IP.
            - name: PVE_VERIFY_SSL
              value: "false"
          ports:
            - name: http
              containerPort: 9221
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
