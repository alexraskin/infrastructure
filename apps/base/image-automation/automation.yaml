# The one thing in this cluster that writes to git. Every five minutes it
# checks out main, rewrites the image tags marked with `$imagepolicy` under
# apps/base to whatever the ImagePolicies now select, and pushes the commit
# back — which the flux-system GitRepository then pulls and rolls out.
#
# This is why the GitRepository is SSH with `flux-git-auth` rather than
# anonymous HTTPS: pushing needs a deploy key with write access.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 72h
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(images): {{ range .Changed.Changes }}{{ .OldValue }} -> {{ .NewValue }} {{ end }}

        Pushed by image-automation-controller.
    push:
      branch: main
  update:
    path: ./apps/base
    strategy: Setters
