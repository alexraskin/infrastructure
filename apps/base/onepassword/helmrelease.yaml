apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword
  namespace: onepassword
spec:
  interval: 1h
  chart:
    spec:
      chart: connect
      version: "2.4.1"
      sourceRef:
        kind: HelmRepository
        name: onepassword
        namespace: onepassword
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    connect:
      create: false
    operator:
      create: true
      authMethod: service-account
      version: "1.12.0"
      serviceAccountToken:
        name: onepassword-service-account-token
        key: token
      watchNamespace: []
      pollingInterval: 600
      autoRestart: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
