# Egress proxies for the two off-cluster probes. Under k3s these were dialled
# straight at their tailnet addresses, because every node ran tailscaled and
# pod egress was SNAT'd to the node's tailnet address. Talos nodes are not on
# the tailnet at all, so the operator has to carry the traffic instead: it
# gives each of these Services a proxy pod with its own tailnet device and
# rewrites externalName to point at it.
#
# The ACL grant for these is src tag:k8s, not the old tag:k3s — see
# tailscale/policy.hujson.
apiVersion: v1
kind: Service
metadata:
  name: cloud-edge-egress
  namespace: gatus
  annotations:
    tailscale.com/tailnet-ip: "100.79.150.123"
spec:
  type: ExternalName
  externalName: placeholder # overwritten by the operator
---
apiVersion: v1
kind: Service
metadata:
  name: chronos-egress
  namespace: gatus
  annotations:
    tailscale.com/tailnet-ip: "100.109.167.97"
spec:
  type: ExternalName
  externalName: placeholder # overwritten by the operator
