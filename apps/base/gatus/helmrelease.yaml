apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 1h
  chart:
    spec:
      chart: gatus
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: gatus
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      strategy: Recreate

    env:
      GATUS_APISERVER_TOKEN:
        valueFrom:
          secretKeyRef:
            name: gatus-probe-token
            key: token
      DISCORD_WEBHOOK_URL:
        valueFrom:
          secretKeyRef:
            name: gatus-discord
            key: webhook-url

    persistence:
      enabled: true
      storageClassName: local-path
      size: 1Gi
      mountPath: /data

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    serviceMonitor:
      enabled: true
      interval: 1m
    ingress:
      enabled: true
      ingressClassName: tailscale
      hosts: []
      tls:
        - hosts:
            - status

    config:
      storage:
        type: sqlite
        path: /data/data.db
        maximum-number-of-results: 100
        maximum-number-of-events: 50

      alerting:
        discord:
          webhook-url: "${DISCORD_WEBHOOK_URL}"
          title: "Infrastructure"
          default-alert:
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true

      ui:
        title: "Infrastructure Status"
        header: "Status"

      endpoints:
        - name: "API (VIP)"
          group: "Control plane"
          url: "https://10.0.200.40:6443/readyz"
          interval: 30s
          client:
            insecure: true
          headers:
            Authorization: "Bearer ${GATUS_APISERVER_TOKEN}"
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == ok"
          alerts:
            - type: discord

        - name: "talos-cp-1"
          group: "Control plane"
          url: "https://10.0.200.41:6443/readyz"
          interval: 60s
          client:
            insecure: true
          headers:
            Authorization: "Bearer ${GATUS_APISERVER_TOKEN}"
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == ok"
          alerts:
            - type: discord

        - name: "talos-cp-2"
          group: "Control plane"
          url: "https://10.0.200.42:6443/readyz"
          interval: 60s
          client:
            insecure: true
          headers:
            Authorization: "Bearer ${GATUS_APISERVER_TOKEN}"
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == ok"
          alerts:
            - type: discord

        - name: "talos-cp-3"
          group: "Control plane"
          url: "https://10.0.200.43:6443/readyz"
          interval: 60s
          client:
            insecure: true
          headers:
            Authorization: "Bearer ${GATUS_APISERVER_TOKEN}"
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == ok"
          alerts:
            - type: discord

        - name: "talos-cp-1"
          group: "Nodes"
          url: "tcp://10.0.200.41:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-cp-2"
          group: "Nodes"
          url: "tcp://10.0.200.42:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-cp-3"
          group: "Nodes"
          url: "tcp://10.0.200.43:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-worker-1"
          group: "Nodes"
          url: "tcp://10.0.200.51:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-worker-2"
          group: "Nodes"
          url: "tcp://10.0.200.52:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-worker-3"
          group: "Nodes"
          url: "tcp://10.0.200.53:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-db-1"
          group: "Nodes"
          url: "tcp://10.0.200.61:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-db-2"
          group: "Nodes"
          url: "tcp://10.0.200.62:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "talos-db-3"
          group: "Nodes"
          url: "tcp://10.0.200.63:50000"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "cloud-edge"
          group: "Off-cluster"
          url: "tcp://cloud-edge-egress.gatus.svc.cluster.local:443"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "chronos (NAS)"
          group: "Off-cluster"
          url: "tcp://chronos-egress.gatus.svc.cluster.local:443"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts:
            - type: discord

        - name: "Plex"
          group: "Off-cluster"
          url: "http://10.0.200.87:32400/identity"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == pat(*machineIdentifier*)"
            - "[RESPONSE_TIME] < 2000"
          alerts:
            - type: discord

        - name: "CoreDNS"
          group: "Platform"
          url: "10.96.0.10"
          interval: 60s
          dns:
            query-name: "kubernetes.default.svc.cluster.local"
            query-type: "A"
          conditions:
            - "[DNS_RCODE] == NOERROR"
          alerts:
            - type: discord

        - name: "Grafana"
          group: "Platform"
          url: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
            - "[RESPONSE_TIME] < 2000"
          alerts:
            - type: discord

        - name: "Prometheus"
          group: "Platform"
          url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/healthy"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: discord

        - name: "Loki"
          group: "Platform"
          url: "http://loki.logging.svc.cluster.local:3100/ready"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: discord

        - name: "Alloy"
          group: "Platform"
          url: "http://alloy.logging.svc.cluster.local:12345/-/ready"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: discord

        - name: "alexraskin.com (origin)"
          group: "Apps"
          url: "http://alexraskin-com.web.svc.cluster.local/ping"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
            - "[RESPONSE_TIME] < 2000"
          alerts:
            - type: discord

        - name: "go-vanityurls (origin)"
          group: "Apps"
          url: "http://go-vanityurls.vanityurls.svc.cluster.local/"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: discord

        - name: "lastfm-now-playing (origin)"
          group: "Apps"
          url: "http://lastfm-now-playing.lastfm.svc.cluster.local/ping"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: discord
