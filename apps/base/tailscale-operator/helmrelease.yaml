apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      # Pinned by hand, like the monitoring stack. Tailscale expects clients to
      # track its own release train — see nix/modules/tailscale.nix for the same
      # reasoning on the node side.
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Left empty on purpose: with oauth.clientId unset the chart mounts a
    # pre-existing Secret named operator-oauth, which is what oauth.sops.yaml
    # provides. Setting them here would put the credentials in the HelmRelease,
    # i.e. in git in cleartext.
    oauth:
      clientId: ""
      clientSecret: ""

    # The chart installs the tailscale.com CRDs from templates/ rather than
    # crds/, so they are upgraded on every release — no CreateReplace needed.
    installCRDs: true

    operatorConfig:
      hostname: k3s-operator
      defaultTags:
        - "tag:k8s-operator"
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

    proxyConfig:
      # Every proxy the operator spawns joins the tailnet with this tag, and
      # tag:k8s-operator must own it in the ACL or device creation is rejected.
      defaultTags: "tag:k8s"

      # Pinned ahead of the chart. The chart's appVersion is 1.98.9, which the
      # admin console flags as vulnerable; tailscale/tailscale:v1.102.2 exists,
      # so the proxies can run the fixed client even though
      # tailscale/k8s-operator has no stable build past v1.98.9 and the operator
      # itself cannot follow yet. Drop this override once a stable chart ships
      # 1.102.x or later — leaving it pinned would hold proxies back instead.
      image:
        tag: "v1.102.2"

    ingressClass:
      name: tailscale
      enabled: true

    # The API-server-over-tailnet proxy stays off. kubectl already reaches the
    # VIP through the subnet router, and turning this on means ACL grants that
    # map tailnet identities onto cluster RBAC.
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"
