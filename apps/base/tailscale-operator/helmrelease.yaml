apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.2"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    oauth:
      clientId: ""
      clientSecret: ""

    installCRDs: true

    operatorConfig:
      hostname: talos-operator
      defaultTags:
        - "tag:k8s-operator"
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

    proxyConfig:

      defaultTags: "tag:k8s"
      image:
        tag: "v1.102.2"

    ingressClass:
      name: tailscale
      enabled: true

    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"
