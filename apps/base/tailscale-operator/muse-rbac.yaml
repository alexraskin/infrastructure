# The group muse is impersonated as by the API server proxy; see tailscale/policy.hujson.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailnet-muse-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tailnet:muse
---
# The built-in `view` ClusterRole does not include nodes, so node status
# monitoring needs this separate read-only role. Still monitor-only:
# get/list/watch, no create/update/delete, no root, no cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: muse-node-view
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailnet-muse-node-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: muse-node-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tailnet:muse
