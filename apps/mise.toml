[tools]
flux2 = "latest"
sops = "latest"
age = "latest"
kubectl = "latest"
kustomize = "latest"

[env]
KUBECONFIG = "{{config_root}}/../kubeconfig"
AGE_KEY_FILE = "{{config_root}}/../secrets/age.key"
SOPS_AGE_KEY_FILE = "{{config_root}}/../secrets/age.key"

# ---------------------------------------------------------------- secrets ----

[tasks.age-key]
description = "Generate the age key Flux decrypts with (once — back this up)"
shell = "bash -c"
run = """
set -euo pipefail
if [ -s "$AGE_KEY_FILE" ]; then
  echo "$AGE_KEY_FILE already exists, leaving it alone"
else
  mkdir -p "$(dirname "$AGE_KEY_FILE")"
  age-keygen -o "$AGE_KEY_FILE" 2>/dev/null
  chmod 600 "$AGE_KEY_FILE"
  echo "wrote $AGE_KEY_FILE — back it up, it is the only way to read the secrets"
fi
pub=$(age-keygen -y "$AGE_KEY_FILE")
echo "public key: $pub"
echo "putting it in .sops.yaml"
sed -i "s|age: .*|age: $pub|" .sops.yaml
"""

[tasks."age-key-to-cluster"]
description = "Load the age private key into the cluster so Flux can decrypt"
depends = ["age-key"]
shell = "bash -c"
run = """
set -euo pipefail
kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
kubectl -n flux-system create secret generic sops-age \
  --from-file=age.agekey="$AGE_KEY_FILE" \
  --dry-run=client -o yaml | kubectl apply -f -
echo "secret/sops-age is in place"
"""

[tasks.sops-encrypt]
description = "Encrypt a secret file in place: mise run sops-encrypt base/cloudflared/token.sops.yaml"
shell = "bash -c"
run = """
set -euo pipefail
f=${1:?usage: mise run sops-encrypt <file>}
grep -q '^sops:' "$f" && { echo "$f is already encrypted"; exit 0; }
sops --encrypt --in-place "$f"
echo "encrypted $f — safe to commit"
"""

[tasks.sops-edit]
description = "Edit an encrypted secret: mise run sops-edit base/cloudflared/token.sops.yaml"
shell = "bash -c"
run = """
set -euo pipefail
sops "${1:?usage: mise run sops-edit <file>}"
"""

# --------------------------------------------------------------- bootstrap ----

[tasks."git-deploy-key"]
description = "Generate the deploy key Flux pushes image-tag bumps with (once — then add it on GitHub)"
shell = "bash -c"
run = """
set -euo pipefail
key="{{config_root}}/../secrets/flux-deploy-key"

# Kept on disk, like secrets/k3s-token and secrets/age.key, so rebuilding the
# cluster does not mean registering a new deploy key on GitHub.
if [ -s "$key" ]; then
  echo "$key already exists, reusing it"
else
  mkdir -p "$(dirname "$key")"
  ssh-keygen -t ed25519 -N '' -C 'flux@k3s' -f "$key" >/dev/null
  chmod 600 "$key"
  echo "wrote $key"
fi

kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
kubectl -n flux-system create secret generic flux-git-auth \
  --from-file=identity="$key" \
  --from-file=identity.pub="$key.pub" \
  --from-literal=known_hosts="$(ssh-keyscan -t rsa,ecdsa,ed25519 github.com 2>/dev/null)" \
  --dry-run=client -o yaml | kubectl apply -f -

echo
cat "$key.pub"
"""

[tasks.install]
description = "Install Flux and point it at this repo"
shell = "bash -c"
run = """
set -euo pipefail

# Controllers only — `flux bootstrap` would commit its own manifests to the repo.
# The two extra ones are what watch GHCR and write the new tags back into
# apps/base; without them the image-automation Kustomization has no CRDs to
# apply and fails on its own, leaving the apps alone.
flux install --components-extra=image-reflector-controller,image-automation-controller

kubectl -n flux-system get secret flux-git-auth >/dev/null 2>&1 || {
  echo "secret/flux-git-auth is missing — run: mise run git-deploy-key" >&2
  exit 1
}

kubectl apply -f clusters/k3s/flux-system.yaml

# Fails until the deploy key is registered on GitHub, which is a manual step.
flux reconcile source git flux-system || {
  echo
  echo "Could not clone over SSH. Is the deploy key from 'mise run git-deploy-key'" >&2
  echo "registered on the repo with write access?" >&2
  exit 1
}

echo
echo "Flux is installed and syncing apps/clusters/k3s from main."
"""

[tasks.status]
description = "Show what Flux thinks the cluster should look like, and whether it agrees"
shell = "bash -c"
run = """
flux get all -A
echo
kubectl get pods -A -o wide | grep -vE 'kube-system|Completed' || true
"""

[tasks.sync]
description = "Stop waiting for the interval — reconcile from git right now"
shell = "bash -c"
run = """
set -euo pipefail
flux reconcile source git flux-system
flux reconcile kustomization image-automation --with-source || true
flux reconcile kustomization cloudflared --with-source || true
flux reconcile kustomization alexraskin-com --with-source || true
flux reconcile kustomization lastfm-now-playing --with-source || true
flux reconcile kustomization lhbotgo --with-source || true
"""
